# CI pipeline for Casa Segura monorepo
# Closes:
#   - CS-004: CI pipeline on PR (backend lint/test + frontend lint/test/typecheck/build)
#   - CS-035: Migration smoke test in CI (forward, rollback to zero, re-apply)
name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Keep in sync with `backend/Dockerfile.*` (`POETRY_VERSION`) and `.tool-versions`.
env:
  POETRY_VERSION: '2.4.1'

jobs:
  # ---------------------------------------------------------------------------
  # 1. Backend lint (no DB required)
  # ---------------------------------------------------------------------------
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-secret
      DEBUG: 'False'
      DB_ENGINE: postgresql
      DB_NAME: casasegura
      DB_USER: postgres
      DB_PASSWORD: administrador
      DB_HOST: localhost
      DB_PORT: '5432'
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      ALLOWED_HOSTS: '*'
      LOG_LEVEL: WARNING
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pip install "poetry==${POETRY_VERSION}"
        working-directory: .

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Configure Poetry (in-project venv)
        run: poetry config virtualenvs.in-project true

      - name: Install backend dependencies
        run: poetry install --no-interaction --no-root --with dev

      - name: Ruff
        run: poetry run ruff check .

      - name: Black (check)
        run: poetry run black --check .

      - name: isort (check)
        run: poetry run isort --check-only .

      - name: Retention scheduler dry validate (ADR-0005 / CS-270 — no DB)
        run: poetry run python scripts/retention_scheduler_dry_validate.py
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: administrador
          POSTGRES_DB: casasegura
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d casasegura"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 5s
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-secret
      DEBUG: 'False'
      DB_ENGINE: postgresql
      DB_NAME: casasegura
      DB_USER: postgres
      DB_PASSWORD: administrador
      DB_HOST: localhost
      DB_PORT: '5432'
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      ALLOWED_HOSTS: '*'
      LOG_LEVEL: WARNING
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pip install "poetry==${POETRY_VERSION}"

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Configure Poetry (in-project venv)
        run: poetry config virtualenvs.in-project true

      - name: Install backend dependencies
        working-directory: backend
        run: poetry install --no-interaction --no-root --with dev

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Create required Postgres extensions
        run: |
          PGPASSWORD=administrador psql -h localhost -U postgres -d casasegura \
            -c 'CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pgcrypto; CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'

      - name: Run migrations
        working-directory: backend
        run: poetry run python manage.py migrate --no-input

      - name: Run pytest
        working-directory: backend
        run: |
          start=$(date +%s)
          poetry run pytest -v --tb=short --reuse-db --create-db
          end=$(date +%s)
          echo "Pytest wall time: $((end-start))s (CS-032 budget: Postgres service reused for migrate+pytest; --reuse-db for local re-runs)"
          if [ $((end-start)) -gt 240 ]; then echo "Pytest exceeded 240s"; exit 1; fi

  # ---------------------------------------------------------------------------
  # 3. Migration smoke test (CS-035): forward -> zero -> forward
  # ---------------------------------------------------------------------------
  backend-migration-smoke:
    name: Backend migration smoke (CS-035)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: administrador
          POSTGRES_DB: casasegura
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d casasegura"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 5s
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-secret
      DEBUG: 'False'
      DB_ENGINE: postgresql
      DB_NAME: casasegura
      DB_USER: postgres
      DB_PASSWORD: administrador
      DB_HOST: localhost
      DB_PORT: '5432'
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      ALLOWED_HOSTS: '*'
      LOG_LEVEL: WARNING
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pip install "poetry==${POETRY_VERSION}"

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Configure Poetry (in-project venv)
        run: poetry config virtualenvs.in-project true

      - name: Install backend dependencies
        working-directory: backend
        run: poetry install --no-interaction --no-root --with dev

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Create required Postgres extensions
        run: |
          PGPASSWORD=administrador psql -h localhost -U postgres -d casasegura \
            -c 'CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pgcrypto; CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'

      - name: Forward migrate (initial)
        working-directory: backend
        run: |
          echo "MIGRATION_SMOKE_START=$(date +%s)" >> "$GITHUB_ENV"
          start=$(date +%s)
          poetry run python manage.py migrate --no-input
          end=$(date +%s)
          echo "Forward migrate took $((end - start))s"

      - name: Roll back all migrations to zero (reverse dependency order)
        working-directory: backend
        run: |
          start=$(date +%s)
          for app in delivery ingestion economics rubric corpus platform_core common; do
            echo "::group::Rolling back $app to zero"
            poetry run python manage.py migrate "$app" zero --no-input
            echo "::endgroup::"
          done
          end=$(date +%s)
          echo "Rollback took $((end - start))s"

      - name: Re-apply forward migrations (symmetry check)
        working-directory: backend
        run: |
          start=$(date +%s)
          poetry run python manage.py migrate --no-input
          end=$(date +%s)
          echo "Re-apply migrate took $((end - start))s"
          if [ -n "${MIGRATION_SMOKE_START:-}" ]; then
            now=$(date +%s)
            elapsed=$((now - MIGRATION_SMOKE_START))
            echo "Migration smoke sequence (forward + rollback + re-apply) elapsed: ${elapsed}s (CS-035 max 600s)"
            if [ "$elapsed" -gt 600 ]; then echo "Migration smoke exceeded 600s"; exit 1; fi
          fi

  # ---------------------------------------------------------------------------
  # 4. Frontend build (lint + typecheck + build)
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
