# Casa Segura — pre-commit configuration (CS-005)
#
# Install once per clone:
#   pip install pre-commit   # or: pipx install pre-commit
#   pre-commit install
#
# Run on demand:
#   pre-commit run --all-files
#
# Scope notes:
# - Python hooks (ruff) only fire on files under `backend/`.
# - Prettier only fires on files under `frontend/` (web-relevant extensions).
# - ESLint is intentionally NOT wired here: it requires the workspace's
#   `node_modules/` and a Next.js-aware config that pre-commit's isolated
#   envs do not provide. Run `npm run lint` from `frontend/` (CI also runs it).
# - mypy is intentionally NOT wired here (too slow for pre-commit; CI gates it).
# - Tests are intentionally NOT wired (deferred).

default_language_version:
  # Interpreter for hook virtualenvs. CI + `backend/pyproject.toml`/`ruff.toml`
  # target Python 3.11; use a 3.11 `python3` on PATH (e.g. pyenv, `backend/.python-version`).
  python: python3

repos:
  # ---------------------------------------------------------------------------
  # Cross-cutting hygiene
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^(docs/|frontend/public/|\.cursor/rules/)
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: check-merge-conflict
      - id: check-yaml
        # pre-commit-hooks' yaml parser does not support custom GitHub Actions
        # tags etc.; keep it conservative on multi-doc files.
        args: ["--allow-multiple-documents"]
      - id: check-toml

  # ---------------------------------------------------------------------------
  # Backend — Python (Django/DRF under backend/)
  # Pinned to match backend/pyproject.toml dev group (ruff >=0.15.13,<0.16.0).
  # CI also runs Black + isort; `ruff format` intentionally stays OFF here —
  # a single autofix/format hook run would churn the whole backend tree on
  # every drift sweep.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        name: ruff (lint + autofix)
        args: ["--fix"]
        files: ^backend/.*\.py$
        exclude: ^backend/.*/migrations/.*$

  # ---------------------------------------------------------------------------
  # Frontend — Prettier check (`--check` only). Mirrors `frontend/package.json`
  # prettier ^3.8.x via an isolated Node env (avoid archived mirrors-* hooks).
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: prettier-front
        name: prettier --check (frontend)
        language: node
        entry: prettier --check
        additional_dependencies:
          - prettier@3.8.3
        files: ^frontend/.*\.(ts|tsx|js|jsx|json|md)$
        exclude: ^frontend/(\.next|node_modules|out|dist|build)/.*$
