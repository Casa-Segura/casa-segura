# Ruff configuration — LINTER ONLY.
# Formatting is owned by black + isort (see pyproject.toml).
# Do not enable ruff's formatter or its isort (`I`) rules here.

target-version = "py311"
line-length = 119

extend-exclude = [
    ".venv",
    "venv",
    "**/migrations/**",
    "**/__pycache__/**",
]

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "DJ",   # flake8-django
    "PL",   # pylint
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",     # line too long — black owns line length
    "PLR0913",  # too many args — common in Django views/serializers
    "PLR2004",  # magic value — common in domain code / constants
    "S101",     # assert used — fine in tests
]

[lint.per-file-ignores]
"**/tests/**" = ["S", "PLR", "PLC0415"]
"**/migrations/**" = ["E", "F", "S", "PLR", "RUF"]
"conftest.py" = ["S", "PLR", "PLC0415"]
"manage.py" = ["PLC0415"]
# Django model files: Meta.constraints/indexes are class-level mutable lists by
# Django convention; the RUF012 ClassVar warning fires on every model. DJ001
# flags optional CharField/TextField columns that intentionally store NULL for
# "value not yet known" semantics — fixing those requires migrations and is
# tracked under CS-002.
"**/infrastructure/django/models.py" = ["RUF012", "DJ001"]
# Domain layer uses lazy imports to break import cycles between
# repositories/specifications/annotations — well-documented pattern, not a bug.
"shared/domain/entities/annotations.py" = ["PLC0415"]
