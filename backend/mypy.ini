[mypy]
python_version = 3.11
plugins = mypy_django_plugin.main

strict_optional = True
warn_unused_ignores = True
warn_return_any = True
disallow_untyped_defs = False
check_untyped_defs = True
ignore_missing_imports = True

# Gradual-typing islands: enforce strict typing in the domain core and the
# observability layer where contracts matter most.
[mypy-platform_core.domain.*]
disallow_untyped_defs = True

[mypy-shared.observability.*]
disallow_untyped_defs = True

# Auto-generated migrations: never type-check.
[mypy-*.migrations.*]
ignore_errors = True

[mypy.plugins.django-stubs]
django_settings_module = "config.settings"
