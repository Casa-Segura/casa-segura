[project]
name = "casa-segura"
version = "0.1.0"
description = ""
authors = [
    {name = "Alejandro Granados",email = "alejandro.granados.dev@gmail.com"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "django (>=5.2,<5.3)",
    "djangorestframework (>=3.15)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "pydantic (>=2.0)",
    "drf-spectacular (>=0.29.0,<0.30.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "django-softdelete (>=0.11.5,<0.12.0)",
    "django-environ (>=0.13.0,<0.14.0)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=7.4.0,<8.0.0)",
    "django-celery-beat (>=2.9.0,<3.0.0)",
    "pgvector (>=0.4.2,<0.5.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "structlog (>=25.5.0,<26.0.0)",
    "django-prometheus (>=2.4.1,<3.0.0)",
    "pillow (>=12.2.0,<13.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-django (>=4.12.0,<5.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "respx (>=0.23.1,<0.24.0)",
    "mypy (>=2.1.0,<3.0.0)"
]

[tool.black]
line-length = 119
extend-exclude = '''
/(
  | migrations
  | .venv/
  | venv/
)/
'''

[tool.isort]
skip_glob = ["**/migrations/*", "**/venv/*", "**/.venv/*"]
profile = "black"
multi_line_output = 3
force_grid_wrap = 0
use_parentheses = true
line_length = 119
known_django = "django"
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "DJANGO", "FIRSTPARTY", "LOCALFOLDER"]
combine_as_imports = true
include_trailing_comma = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

