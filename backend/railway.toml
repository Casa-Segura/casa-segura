# Railway service config for the Casa Segura backend.
#
# Layout: one project on Railway with multiple services that share this
# directory as their Root Directory (`/backend`). There is one Dockerfile
# per process (`Dockerfile.web`, `Dockerfile.worker`, `Dockerfile.beat`);
# each Railway service selects its image via the dashboard
# (Settings → Build → Dockerfile Path).
#
# Defaults in this file are tuned for the `web` service (Gunicorn + Django).
# The `worker` and `beat` services override `dockerfilePath` and
# `startCommand` in the dashboard (see RAILWAY.md at the repo root).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.web"

[deploy]
# Run migrations + collectstatic on every deploy before traffic shifts.
# Idempotent; safe to run repeatedly.
preDeployCommand = "python manage.py migrate --noinput && python manage.py collectstatic --noinput"

# Default start command — `web` service. Bind to $PORT (Railway sets this).
# `sh -c` is required so $PORT expands; Railway runs startCommand as exec form.
startCommand = "sh -c 'gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --access-logfile -'"

# Healthcheck — DRF health endpoint wired in CS-008. Returns 200 if Django boots.
healthcheckPath = "/api/health/"
healthcheckTimeout = 30

# Restart on crash, with a cap to avoid loops on misconfigured deploys.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
