# Railway — shared backend config for web, worker, and beat.
#
# Layout: one Railway project, three Git-backed services (web, worker,
# beat) all using `/backend` as Root Directory. Each service runs its
# own Dockerfile (Dockerfile.web / .worker / .beat) and its own start
# command.
#
# ⚠ This file is loaded for EVERY service that mounts /backend, and
# Railway's config-as-code precedence rules
# (https://docs.railway.com/config-as-code/reference) make any key set
# here OVERRIDE the dashboard for the same service. So only the keys
# that are TRULY shared across web/worker/beat live here.
#
# Process-specific keys (dockerfilePath, startCommand,
# preDeployCommand, healthcheckPath) MUST be set per-service in the
# Railway dashboard — see RAILWAY.md §5 for the per-service table.

[build]
builder = "DOCKERFILE"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
