# Railway — shared backend config for web, worker, and beat
# (all three share Root Directory `/backend` so this file is loaded for each).
#
# ⚠ CRITICAL: Railway's config-as-code OVERRIDES the dashboard for any key
# present in this file (https://docs.railway.com/config-as-code/reference).
# Three services share this file — only keys that are identical across web,
# worker, and beat may live here. Process-specific keys (dockerfilePath,
# startCommand, preDeployCommand, healthcheckPath) MUST be set per-service
# in the dashboard (or via RAILWAY_DOCKERFILE_PATH for the build target).
#
# Bug history: leaving `dockerfilePath = "Dockerfile.web"` here silently
# forced the worker and beat services to build the web (gunicorn) image,
# crashed them on the missing $PORT and a healthcheck they don't serve,
# and meant Celery tasks (email, SMS, rubric pipeline) never ran. See
# RAILWAY.md §5 for the per-service dashboard table.

[build]
builder = "DOCKERFILE"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
