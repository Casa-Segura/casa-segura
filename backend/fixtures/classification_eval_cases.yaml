# Classification evaluation set (CS-115).
#
# Curated synthetic contract excerpts spanning the eight covered types
# (CVC, CVP, ARV, ARC, APV, LEA, IVU, FSV) plus NOT_CLASSIFIABLE
# negatives drawn from PRD_F2_CLASIFICACION US-06's exclusion list.
#
# Every `contract_text` is synthetic. Per BR-07 / PRD_GENERAL §10 the
# corpus MUST NOT contain real names, addresses, DUI, IBAN, phone
# numbers, or emails. Use obvious placeholders (JUAN PÉREZ, MARÍA
# GARCÍA, Calle Falsa 123, $185,000.00). Maintainers MUST keep this rule
# when adding cases — review with grep before merge.
#
# Schema:
#   - id:              stable identifier (string, lowercase, dash-sep).
#   - contract_type:   gold label (one of the nine ContractType values).
#   - description:     one-sentence Spanish summary of the scenario.
#   - contract_text:   synthetic excerpt (~300-500 chars).
#   - expected:
#       contract_type:   gold post-classification ContractType.
#       min_confidence:  float in [0, 1]; harness asserts >=.
#       leasing_indicators (optional, purchase types only):
#         expected_count:           int 0..6 of Art. 2 LAF flags.
#         expected_recommendation:  final type after CS-111 (CVC|CVP|APV|LEA).
#   - tags:            free-form labels (happy_path, bva, borderline, ...).
#
# Thresholds (declared once here; the harness reads them at runtime):
#
thresholds:
  # PRD F2 §9: ≥95% success on in-scope documents.
  macro_accuracy_min: 0.95
  # PRD F2 §9: NOT_CLASSIFIABLE precision floor (low FP into in-scope).
  not_classifiable_precision_min: 0.90
  # PRD F2 §9: reclassification false-positive budget (<2%).
  reclassification_false_positive_max: 0.02
  # PRD F2 §9: reclassification false-negative budget (<10%).
  reclassification_false_negative_max: 0.10

cases:
  # ----------------------------------------------------------------------
  # CVC — Compraventa al contado (3 cases).
  # ----------------------------------------------------------------------
  - id: cls-cvc-001
    contract_type: CVC
    description: "Compraventa al contado canónica — pago único en efectivo."
    contract_text: |
      CONTRATO DE COMPRAVENTA AL CONTADO. JUAN PÉREZ, vendedor, transfiere
      a MARÍA GARCÍA, compradora, el inmueble situado en Calle Falsa 123,
      San Salvador. El precio total es de CIENTO OCHENTA Y CINCO MIL
      DÓLARES (USD 185,000.00) que la compradora entrega en este acto, en
      su totalidad, mediante cheque de caja a la firma de la presente
      escritura. No queda saldo pendiente ni se acuerdan cuotas. La
      tradición se hace de inmediato.
    expected:
      contract_type: CVC
      min_confidence: 0.85
      leasing_indicators:
        expected_count: 0
        expected_recommendation: CVC
    tags: [happy_path, cash_payment, no_leasing_indicators]

  - id: cls-cvc-002
    contract_type: CVC
    description: "Compraventa al contado con cláusula de saneamiento."
    contract_text: |
      Compareció JUAN PÉREZ y vendió a MARÍA GARCÍA el lote número 7 del
      Residencial Sintético por el precio único de NOVENTA Y CINCO MIL
      DÓLARES (USD 95,000.00), pagado íntegramente en este acto por
      transferencia bancaria. El vendedor responde por saneamiento por
      evicción y vicios ocultos conforme los artículos 1639 y 1660 del
      Código Civil. No hay financiamiento, prima ni cuotas.
    expected:
      contract_type: CVC
      min_confidence: 0.85
      leasing_indicators:
        expected_count: 0
        expected_recommendation: CVC
    tags: [happy_path, warranty_clause]

  - id: cls-cvc-003
    contract_type: CVC
    description: "Compraventa al contado por escritura pública, pago total recibido."
    contract_text: |
