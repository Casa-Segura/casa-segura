# Railway service config for the Casa Segura backend — `beat` service.
#
# Loaded when the beat service has
# Settings → Source → Config File Path = railway.beat.toml.
#
# Single beat instance only (never scale to >1 — django_celery_beat
# uses a DB scheduler that doesn't tolerate concurrent leaders).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.beat"

[deploy]
startCommand = "celery -A config.celery beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
